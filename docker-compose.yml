services:
  postgres:
    image: postgres:15-alpine
    container_name: calls_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - calls_postgres_data:/var/lib/postgresql/data
    networks:
      - calls_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calls_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CONTROL_PLANE_API_TOKEN: ${CONTROL_PLANE_API_TOKEN:?CONTROL_PLANE_API_TOKEN is required}
      CONTROL_PLANE_TENANT_ID: "${CONTROL_PLANE_TENANT_ID:-1}"
      CONTROL_PLANE_ADMIN_ENABLED: "false"

      DB_DIALECT: postgres
      DB_PORT: 5432
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
      PROXY_PORT: 3100
      PORT: 3100
      TRUST_PROXY_HOPS: "1"
      REQUEST_BODY_LIMIT: "1mb"
      RUN_DB_MIGRATIONS: "false"
      RUN_DB_SEEDS: "false"
      DB_WAIT_SECONDS: "60"

      POSTGRES_POOLMAX: ${POSTGRES_POOLMAX:-50}
      POSTGRES_POOLMIN: ${POSTGRES_POOLMIN:-10}
      POSTGRES_POOLACQUIRE: ${POSTGRES_POOLACQUIRE:-30000}
      POSTGRES_POOLIDLE: ${POSTGRES_POOLIDLE:-10000}

      VOICE_PROVIDER_TIMEOUT_MS: ${VOICE_PROVIDER_TIMEOUT_MS:-10000}
      VOICE_DISPATCH_ENABLED: "false"
      VOICE_PREFLIGHT_ENABLED: "false"
      VOICE_ENABLED_PROVIDERS: ""
      VOICE_ELEVENLABS_AGENT_ALLOWLIST: ""
      VOICE_ELEVENLABS_PHONE_ALLOWLIST: ""
      ENABLE_LEGACY_TOKEN_PATHS: "false"
      ENABLE_CURL_EXECUTOR: "false"
    ports:
      - "127.0.0.1:${BACKEND_EXPOSE_PORT:-3100}:3100"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - calls_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calls_frontend
    environment:
      PORT: 3001
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3100}
    ports:
      - "127.0.0.1:${FRONTEND_EXPOSE_PORT:-3001}:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - calls_network
    restart: unless-stopped

volumes:
  calls_postgres_data:

networks:
  calls_network:
    driver: bridge
