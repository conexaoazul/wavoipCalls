name: Mágica Voice hardening CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/magica-voice-ci.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: magica-voice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for high-confidence secret signatures
        run: bash scripts/secret-scan.sh

  lab-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-dispatch LAB contract
        run: |
          cp deploy/lab/.env.lab.example .env.lab
          bash scripts/lab-preflight.sh .env.lab

  lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral LAB env
        run: cp deploy/lab/.env.lab.example .env.lab
      - name: Start isolated PostgreSQL
        run: docker compose --env-file .env.lab -f deploy/lab/docker-compose.yml up -d postgres
      - name: Apply migrations once
        run: docker compose --env-file .env.lab -f deploy/lab/docker-compose.yml --profile migration run --rm migrate
      - name: Start backend with dispatch OFF
        run: docker compose --env-file .env.lab -f deploy/lab/docker-compose.yml up -d backend
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3110/health/ready >/dev/null; then
              echo "LAB backend ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.lab -f deploy/lab/docker-compose.yml logs --no-color backend
          exit 1
      - name: Prove dispatch remains off
        run: |
          docker compose --env-file .env.lab -f deploy/lab/docker-compose.yml exec -T backend             sh -c '[ "$VOICE_DISPATCH_ENABLED" = "false" ] && [ "$VOICE_PREFLIGHT_ENABLED" = "true" ]'
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.lab -f deploy/lab/docker-compose.yml down -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck + tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        env:
          CI: 'true'
        run: npm run build
