name: Mágica Voice hardening CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/magica-voice-ci.yml'
  push:
    branches:
      - 'feat/magica-voice-elevenlabs-lab-20261006'
    paths:
      - 'backend/**'
      - '.github/workflows/magica-voice-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck + tests
        run: npm test
