name: Mágica Voice hardening CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/magica-voice-ci.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: magica-voice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for high-confidence secret signatures
        run: bash scripts/secret-scan.sh

  lab-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-dispatch LAB contract
        run: |
          cp deploy/lab/.env.lab.example .env.lab
          bash scripts/lab-preflight.sh .env.lab

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck + tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        env:
          CI: 'true'
        run: npm run build
